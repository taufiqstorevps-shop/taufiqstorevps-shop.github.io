<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Starter - TAUFIQSHOPVPS</title>
<style>
body {font-family: Arial, sans-serif; background:#000; color:#fff; margin:0; padding:0;}
header{background:#111;text-align:center;padding:20px;font-size:2em;font-weight:bold;}
.container{padding:20px; max-width:500px; margin:auto;}
form{display:flex; flex-direction:column; gap:10px; background:#1f1f1f; padding:20px; border-radius:10px;}
input, select{padding:10px; border-radius:6px; border:none;}
button{padding:12px; border:none; border-radius:8px; font-weight:bold; background:linear-gradient(45deg,#16a34a,#22c55e); color:#fff; cursor:pointer; transition:0.3s;}
button:hover{opacity:0.8;}
.message{margin-top:10px; color:#22c55e; font-weight:bold;}
</style>
</head>
<body>

<header>Order Paket Starter</header>
<div class="container">
<form id="orderForm">
  <input type="text" placeholder="Nama" name="nama" required>
  <input type="text" placeholder="Nomor WA" name="wa" required>
  <input type="email" placeholder="Gmail" name="gmail" required>
  <input type="text" placeholder="Password Panel" name="password" required>
  <input type="text" value="Starter | RAM 1GB" name="paket" readonly>
  <label>Metode Pembayaran: QRIS</label>
  <input type="text" placeholder="Masukkan QRIS (link/gambar)" name="qris" required>
  <button type="submit">Submit Order</button>
  <div class="message" id="msg"></div>
</form>
</div>

<script>
document.getElementById('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = {
    nama: this.nama.value,
    wa: this.wa.value,
    gmail: this.gmail.value,
    password: this.password.value,
    paket: this.paket.value,
    qris: this.qris.value,
    status: 'Baru'
  };
  let orders = JSON.parse(localStorage.getItem('orders')||'[]');
  orders.push(data);
  localStorage.setItem('orders', JSON.stringify(orders));
  document.getElementById('msg').innerText = "Order kamu sedang di proses";
  this.reset();
});
</script>

</body>
</html>
