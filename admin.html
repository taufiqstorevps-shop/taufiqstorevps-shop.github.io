<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - TAUFIQSHOPVPS</title>
<style>
body {font-family: Arial, sans-serif; background:#000; color:#fff; margin:0; padding:0;}
header{background:#111;text-align:center;padding:20px;font-size:2em;font-weight:bold;}
.container{padding:20px; max-width:900px; margin:auto;}
table{width:100%; border-collapse: collapse;}
th, td{border:1px solid #444; padding:10px; text-align:center;}
th{background:#222;}
tr:nth-child(even){background:#111;}
button{padding:6px 12px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition:0.3s;}
.sukses{background:#16a34a; color:#fff;}
.refresh{background:#2563eb; color:#fff; margin-bottom:10px;}
.status-siap{color:#22c55e; font-weight:bold;}
</style>
</head>
<body>
<header>Panel Admin TAUFIQSHOPVPS</header>
<div class="container">
<button class="refresh" onclick="loadOrders()">Refresh Order</button>
<table id="ordersTable">
  <thead>
    <tr>
      <th>Nama</th>
      <th>WA</th>
      <th>Gmail</th>
      <th>Password</th>
      <th>Paket</th>
      <th>Status</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>
// Load semua order dari localStorage
function loadOrders(){
  const tbody = document.querySelector('#ordersTable tbody');
  tbody.innerHTML = '';
  let orders = JSON.parse(localStorage.getItem('orders')||'[]');
  orders.forEach((order, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${order.nama}</td>
      <td>${order.wa}</td>
      <td>${order.gmail}</td>
      <td>${order.password}</td>
      <td>${order.paket}</td>
      <td class="${order.status==='Siap'?'status-siap':''}">${order.status}</td>
      <td><button class="sukses" onclick="markSukses(${index})">Sukses</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Tombol sukses
function markSukses(index){
  let orders = JSON.parse(localStorage.getItem('orders')||'[]');
  orders[index].status = 'Siap';
  localStorage.setItem('orders', JSON.stringify(orders));
  alert('ORDER KAMU SIAP TINGGAL KAMU KE WHATSAAP HBIS ITU BOT NGIRIM DATA PANEL LINK USER NAME CEPETAN LIHAT');
  loadOrders();
}

// Load otomatis saat buka halaman
loadOrders();
</script>

</body>
</html>
